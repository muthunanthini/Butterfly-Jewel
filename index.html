<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=html/login.html">
  <title>Butterfly Jewel</title>
  <script>
    // If user is already logged in, redirect directly to home.html, otherwise login.html
    const user = localStorage.getItem('username');
    if (user) {
      window.location.replace("html/home.html");
    } else {
      window.location.replace("html/login.html");
    }
  </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 50px;">
  <p>Loading Butterfly Jewel... <a href="html/login.html">Click here if you are not redirected automatically.</a></p>
</body>
</html>
